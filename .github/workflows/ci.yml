name: Tea CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
defaults:
  run:
    shell: bash

jobs:

  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is macos-26 (Xcode 26 / Swift 6.3 SDK). setup-swift
          # 5.9–6.1 cannot compile Package.swift against that SDK.
          # macos-11 / macos-13 are retired; macos-14 is in brownout.
          - os: macos-15
            xcode_select: /Applications/Xcode_16.4.app/Contents/Developer
            name: Xcode 16.4 on macos-15
          - os: macos-26
            xcode_select: ""
            name: default Xcode on macos-26
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Select Xcode
      if: matrix.xcode_select != ''
      run: sudo xcode-select -s "${{ matrix.xcode_select }}"
    - name: Verify toolchain
      run: |
        xcodebuild -version
        swift --version
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v
