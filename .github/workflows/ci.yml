name: Tea CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:

  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is macos-26 (Xcode 26 / Swift 6.3 SDK). setup-swift
          # 5.9–6.1 cannot compile Package.swift against that SDK.
          # macos-11 / macos-13 are retired; macos-14 is in brownout.
          - os: macos-15
            xcode_select: /Applications/Xcode_16.4.app/Contents/Developer
            name: Xcode 16.4 on macos-15
          - os: macos-26
            xcode_select: ""
            name: default Xcode on macos-26
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Select Xcode
      if: matrix.xcode_select != ''
      run: sudo xcode-select -s "${{ matrix.xcode_select }}"
    - name: Verify toolchain
      run: |
        xcodebuild -version
        swift --version
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v

  linux:
    name: Swift ${{ matrix.swift }} on Linux
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}
    strategy:
      fail-fast: false
      matrix:
        swift: ["5.7.3-jammy", "5.8.1-jammy", "5.9.2-jammy", "5.10.1-jammy", "6.0.3-jammy", "6.1.3-jammy", "6.2.4-jammy", "6.3.3-jammy", "6.4.0-jammy"]
    steps:
    - uses: actions/checkout@v4
    - run: swift --version
    - name: Run tests
      if: ${{ !startsWith(matrix.swift, '5.7.') }}
      run: swift test
    - name: Verify Swift 5.7 is unsupported on Linux
      if: startsWith(matrix.swift, '5.7.')
      run: |
        if swift test > swift-test.log 2>&1; then
          cat swift-test.log
          exit 1
        fi
        cat swift-test.log
        grep -F "error: Tea on Linux requires Swift 5.8 or later." swift-test.log
