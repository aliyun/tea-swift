name: Tea CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
defaults:
  run:
    shell: bash

jobs:

  build-macos-latest:
    name: Swift ${{ matrix.swift }} on macos-latest
    strategy:
      matrix:
        swift: ["5.9", "5.10", "6.1"]
      fail-fast: false
    runs-on: macos-latest
    steps:
    - uses: swift-actions/setup-swift@v2
      with:
        swift-version: ${{ matrix.swift }}
    - uses: actions/checkout@v4
    - name: Verify Xcode Version
      run: xcodebuild -version
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v

  build-macos-11:
    name: Swift ${{ matrix.swift }} on macos-11
    strategy:
      matrix:
        swift: ["5.6", "5.7", "5.8"]
      fail-fast: false
    runs-on: macos-11
    steps:
    - uses: swift-actions/setup-swift@v2
      with:
        swift-version: ${{ matrix.swift }}
    - uses: actions/checkout@v4
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v
